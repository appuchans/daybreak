<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Daybreak News</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: single-column phone feed, lead story first, sticky section tabs. */
:root{
  --bg:#f6f7f9; --card:#ffffff; --fg:#14181f; --muted:#5b6573; --line:#dde1e8; --accent:#0b5fff; --accent-fg:#ffffff;
  --display:'Fraunces',Georgia,serif; --body:'Public Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--fg:#eceff4;--muted:#9aa5b4;--line:#2a313c;--accent:#6c9bff;--accent-fg:#0e1116;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--fg:#eceff4;--muted:#9aa5b4;--line:#2a313c;--accent:#6c9bff;--accent-fg:#0e1116;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 32px}
.wrap{max-width:640px;margin-inline:auto}
header{padding-block:20px 12px}
.date{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:32px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding-block:10px;z-index:2;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);font:500 14px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tab:focus-visible,.story:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:12px;padding-block:16px}
.story{display:block;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:inherit;text-decoration:none}
.story h2{font-family:var(--display);font-size:19px;line-height:1.25;margin:6px 0;text-wrap:balance}
.story p{margin:0;color:var(--muted);font-size:15px}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.meta span:last-child{color:var(--muted)}
.lead h2{font-size:26px}
.note{font-size:13px;color:var(--muted);padding-block:8px}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}.status{font-size:13px;color:var(--muted);padding-block:6px 0}.empty{color:var(--muted);padding-block:24px;text-align:center}.also{font-size:12px;color:var(--muted);margin-top:6px}</style>
</head>
<body>
<div class="wrap">
<header><div class="date" id="date"></div><h1>Daybreak News</h1><div class="status" id="status" role="status"></div></header>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<main id="feed"></main>
<p class="note">Headlines link to their original publishers.</p>
</div>
<script>
// Last-resort sample shown only when news.json and the saved copy are both unavailable.
var FALLBACK={generatedAt:"2026-10-03T08:00:00Z",order:["world","us","tech","india"],sections:{
world:{label:"World",items:[
{title:"Iran live updates: Trump says war will be over 'very soon,' but offers no details",snippet:"Latest from the Iran conflict as of Oct 1.",url:"https://abcnews.com/International/live-updates/iran-live-updates-saudi-foreign-minister-arrives-us/?id=136814503",source:"ABC News"},
{title:"US announces $24.4 billion contract to speed up missile production",snippet:"The Defense Department says the agreement will support faster manufacturing of defence missiles.",url:"https://www.educationtimes.com/news/school-assembly-news-headlines-for-october-3-2026-top-national-international-business-and-sports-updates/articleshow/134635640.cms",source:"Education Times"}]},
us:{label:"US",items:[
{title:"Top Democrats battle over California's proposed billionaire tax",snippet:"Sanders and Khanna rally for a one-time 5% wealth tax as early voting opens.",url:"https://abcnews.com/Politics/top-democrats-battle-californias-proposed-billionaire-tax/story?id=136951176",source:"ABC News"},
{title:"Christa Pike unconscious and on ventilator after botched execution, attorneys say",snippet:"The execution was paused amid a federal challenge.",url:"https://abcnews.com/US/execution-lone-woman-tennessees-death-row-paused-federal/story?id=136893331",source:"ABC News"}]},
tech:{label:"Tech",items:[]},
india:{label:"India",items:[
{title:"Delhi launches AI-based pollution monitoring control centre",snippet:"The centre will track sources of air pollution in real time.",url:"https://www.educationtimes.com/news/school-assembly-news-headlines-for-october-3-2026-top-national-international-business-and-sports-updates/articleshow/134635640.cms",source:"Education Times"}]}}};

var KEY_DATA="dn-news",KEY_TAB="dn-tab";
var data=FALLBACK,mode="sample",cur="world";
var tabs=document.getElementById("tabs"),feed=document.getElementById("feed"),statusEl=document.getElementById("status");
document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
try{cur=localStorage.getItem(KEY_TAB)||"world"}catch(e){}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safe(u){return /^https?:\/\//i.test(u)?u:"#"}
function ago(iso){var m=Math.max(0,Math.round((Date.now()-Date.parse(iso))/60000));if(m<2)return"just now";if(m<60)return m+" min ago";var h=Math.round(m/60);if(h<48)return h+" h ago";return Math.round(h/24)+" days ago"}

function render(){
  var order=data.order||Object.keys(data.sections);
  if(!data.sections[cur])cur=order[0];
  tabs.innerHTML=order.map(function(id){return'<button class="tab" aria-pressed="'+(id===cur)+'" data-c="'+id+'">'+esc(data.sections[id].label)+'</button>'}).join("");
  var list=data.sections[cur].items||[];
  feed.innerHTML=list.length?list.map(function(s,i){
    var also=s.alsoReportedBy&&s.alsoReportedBy.length?'<div class="also">Also reported by '+esc(s.alsoReportedBy.join(", "))+'</div>':"";
    return'<a class="story'+(i===0?' lead':'')+'" href="'+esc(safe(s.url))+'" target="_blank" rel="noopener noreferrer"><div class="meta"><span>'+esc(s.source)+'</span></div><h2>'+esc(s.title)+'</h2>'+(s.snippet?'<p>'+esc(s.snippet)+'</p>':'')+also+'</a>'
  }).join(""):'<p class="empty">No stories in this section right now.</p>';
  var when=ago(data.generatedAt);
  statusEl.textContent=mode==="live"?"Updated "+when:mode==="saved"?"Offline. Showing stories saved "+when+".":"Live news unavailable. Showing sample stories from "+when+".";
}

tabs.addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;cur=b.dataset.c;try{localStorage.setItem(KEY_TAB,cur)}catch(x){}render();window.scrollTo(0,0)});

try{var saved=JSON.parse(localStorage.getItem(KEY_DATA));if(saved&&saved.sections){data=saved;mode="saved"}}catch(e){}
render();
fetch("news.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
  if(!j||!j.sections)throw new Error("bad shape");
  data=j;mode="live";try{localStorage.setItem(KEY_DATA,JSON.stringify(j))}catch(e){}render();
}).catch(function(){});
</script>
</body>
</html>
