name: Build and deploy

on:
  schedule:
    - cron: "30 0,12 * * *"
  workflow_dispatch:
    inputs:
      relay:
        description: Only wait for the next update time (no build)
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ !inputs.relay }}
    runs-on: ubuntu-latest
    # One build at a time, and a newer one replaces an older one still running: two overlapping builds
    # doubled the Gemini calls and let the older one deploy last (2026-10-04).
    concurrency:
      group: build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch previously published news.json
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news.json" -o previous-news.json || true
      - name: Fetch previous AI classification cache
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/classify-cache.json" -o previous-classify-cache.json || true
      - run: node scripts/build-news.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp news.json classify-cache.json _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Builds run twice a day, at 00:30 and 12:30 UTC (6 am and 6 pm India time), to stay within the free
  # Gemini quota. GitHub's cron has never fired for this repository, so each run schedules the next: wait
  # until the next update time, then dispatch this workflow with the built-in token (workflow_dispatch is
  # one of the two events that token may trigger). A job may run at most 6 hours, so a longer wait is split:
  # after 5 h 45 min the job dispatches a `relay` run, which skips the build and only waits again.
  # `always()` keeps the chain alive after a failed build. Every push starts a chain too; the concurrency
  # group cancels the older waiting job, so only one chain survives.
  next:
    needs: [build, deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write
    concurrency:
      group: next-run
      cancel-in-progress: true
    steps:
      - name: Wait for the next update time, then start it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          today=$(date -u +%Y-%m-%d)
          tomorrow=$(date -u -d "$today +1 day" +%Y-%m-%d)
          for slot in "$today 00:30" "$today 12:30" "$tomorrow 00:30"; do
            target=$(date -u -d "$slot" +%s)
            [ "$target" -gt $((now + 120)) ] && break
          done
          wait=$((target - now))
          echo "Next update at $(date -u -d @"$target"), in $wait s"
          if [ "$wait" -gt 20700 ]; then
            sleep 20700
            gh workflow run news.yml --repo "$GITHUB_REPOSITORY" --ref main -f relay=true
          else
            sleep "$wait"
            gh workflow run news.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
