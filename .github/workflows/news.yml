name: Build and deploy

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # One build at a time, and a newer one replaces an older one still running: two overlapping builds
    # doubled the Gemini calls and let the older one deploy last (2026-10-04).
    concurrency:
      group: build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch previously published news.json
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news.json" -o previous-news.json || true
      - name: Fetch previous AI classification cache
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/classify-cache.json" -o previous-classify-cache.json || true
      - run: node scripts/build-news.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp news.json classify-cache.json _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Builds run every hour at half past (UTC). At about 10 Gemini calls a build that is roughly 240 of the free
  # tier's 500 calls a day, leaving room for pushes and the occasional re-rating. GitHub's cron has never fired
  # for this repository, so each run schedules the next: wait until the next half hour, then dispatch this
  # workflow with the built-in token (workflow_dispatch is one of the two events that token may trigger).
  # `always()` keeps the chain alive after a failed build. Every push starts a chain too; the concurrency
  # group cancels the older waiting job, so only one chain survives.
  next:
    needs: [build, deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    concurrency:
      group: next-run
      cancel-in-progress: true
    steps:
      - name: Wait for the next update time, then start it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          target=$(( now - now % 3600 + 1800 ))
          while [ "$target" -le $((now + 120)) ]; do target=$((target + 3600)); done
          echo "Next update at $(date -u -d @"$target")"
          sleep $((target - now))
          gh workflow run news.yml --repo "$GITHUB_REPOSITORY" --ref main
