name: Build and deploy

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch previously published news.json
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news.json" -o previous-news.json || true
      - run: node scripts/build-news.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html news.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
