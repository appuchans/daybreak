name: Build and deploy

on:
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch previously published news.json
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news.json" -o previous-news.json || true
      - name: Fetch previous AI classification cache
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/classify-cache.json" -o previous-classify-cache.json || true
      - run: node scripts/build-news.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp news.json classify-cache.json _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Every two hours, to stay within the free Gemini quota (a 27-minute loop made ~500 calls a day).
  # GitHub's cron has never fired for this repository, so each run schedules the next: wait, then
  # dispatch this workflow again. workflow_dispatch is one of the two events a run may trigger with
  # the built-in token. `always()` keeps the chain alive after a failed build. Every push starts a
  # chain too; the concurrency group cancels the older waiting job, so only one chain survives.
  next:
    needs: [build, deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    concurrency:
      group: next-run
      cancel-in-progress: true
    steps:
      - run: sleep 7080
      - run: gh workflow run news.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
