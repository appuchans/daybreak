name: Check candidate feeds

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/candidates.json
      - scripts/check-feeds.mjs
      - .github/workflows/check-feeds.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-feeds.mjs scripts/candidates.json
